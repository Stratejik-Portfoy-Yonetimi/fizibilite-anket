<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fizibilite Değerlendirme</title>
<meta name="description" content="Fizibilite Komitesi anonim proje puanlama anketi">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#12232e; --muted:#5d7080; --line:#dfe6ec;
    --brand:#0f6e5c; --brand-soft:#e6f2ef; --brand-ink:#0a4c40; --danger:#b3261e; --radius:14px;
    --ipucu-bg:#eef2f5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101619; --card:#18222a; --ink:#e6edf1; --muted:#95a7b3; --line:#2b3942;
      --brand:#2f9c84; --brand-soft:#173029; --brand-ink:#9fdccb; --danger:#f28b82; --ipucu-bg:#1c272e;
    }
    :root:not([data-theme="light"]) .durum.kapali .ico{background:#3a2f12;color:#f3cf6b;}
  }
  :root[data-theme="dark"]{
    --bg:#101619; --card:#18222a; --ink:#e6edf1; --muted:#95a7b3; --line:#2b3942;
    --brand:#2f9c84; --brand-soft:#173029; --brand-ink:#9fdccb; --danger:#f28b82; --ipucu-bg:#1c272e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:0 0 64px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}

  header.hero{background:linear-gradient(135deg,var(--brand-ink),var(--brand));color:#fff;padding:34px 0 28px;margin-bottom:20px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.82;margin:0 0 8px;}
  h1{font-size:23px;line-height:1.28;margin:0 0 10px;font-weight:650;}
  .hero p.desc{margin:0;opacity:.9;font-size:14.5px;max-width:58ch;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px;}
  .card.intro{border-left:4px solid var(--brand);}
  .label{font-weight:600;font-size:15px;margin:0 0 4px;display:block;}
  .req{color:var(--danger);margin-left:2px;}
  .hint{color:var(--muted);font-size:13px;margin:0 0 12px;}

  input[type=text]{
    width:100%;padding:12px 14px;font-size:16px;font-family:inherit;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s;
  }
  #kimlik{text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}

  .gizlilik{
    display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);
    border-radius:10px;padding:12px 14px;margin-top:14px;color:var(--brand-ink);font-size:13.2px;line-height:1.45;
  }
  .gizlilik .ico{flex:0 0 auto;font-size:15px;line-height:1.3;}

  .q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
  .q-num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);
         font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .q-text{font-size:15.5px;font-weight:550;line-height:1.45;}

  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
  .scale input{position:absolute;opacity:0;width:0;height:0;}
  .scale label{display:flex;align-items:center;justify-content:center;height:44px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);cursor:pointer;font-size:15px;font-weight:600;color:var(--muted);
    user-select:none;transition:all .12s;}
  .scale label:hover{border-color:var(--brand);color:var(--brand-ink);}
  .scale input:checked + label{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(15,110,92,.3);}
  .scale input:focus-visible + label{box-shadow:0 0 0 3px var(--brand-soft);}
  .scale-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px;}

  .ipucu{
    display:block;text-align:center;line-height:1.5;
    color:var(--muted);font-size:13px;margin:0 0 14px;padding:10px 14px;
    background:var(--ipucu-bg);border-radius:10px;
  }
  .ipucu b{color:var(--brand-ink);font-weight:600;}

  .card.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(179,38,30,.08);}
  .err{color:var(--danger);font-size:13px;margin-top:9px;display:none;}
  .card.invalid .err{display:block;}

  .actions{margin-top:20px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  button.submit{width:100%;padding:15px;border:none;border-radius:12px;background:var(--brand);color:#fff;
    font-size:16.5px;font-weight:650;font-family:inherit;cursor:pointer;transition:background .15s,transform .05s;}
  button.submit:hover{background:var(--brand-ink);}
  button.submit:active{transform:translateY(1px);}
  button.submit:disabled{background:#9fb3ad;cursor:not-allowed;}
  .progress{color:var(--muted);font-size:13.5px;}
  .progress b{color:var(--brand-ink);}

  .durum{text-align:center;padding:48px 24px;}
  .durum .ico{width:64px;height:64px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
    font-size:30px;line-height:64px;margin:0 auto 18px;}
  .durum.kapali .ico{background:#fdeec8;color:#7a5a00;}
  .durum.hata .ico{background:#fbe3e1;color:var(--danger);}
  .durum h2{margin:0 0 8px;font-size:21px;}
  .durum p{color:var(--muted);margin:0;}
  .durum button{margin-top:18px;padding:11px 22px;border:1px solid var(--brand);border-radius:10px;background:transparent;
    color:var(--brand-ink);font:inherit;font-weight:600;cursor:pointer;}
  .spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);
    margin:0 auto 16px;animation:dn .9s linear infinite;}
  @keyframes dn{to{transform:rotate(360deg);}}
  .durum p.donem-kod{margin-top:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;}

  footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:26px;}
  .hidden{display:none;}

  @media (max-width:560px){
    h1{font-size:19.5px;}
    .card{padding:16px;}
    .scale{grid-template-columns:repeat(5,1fr);gap:7px;}
    .scale label{height:46px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="baslik">&nbsp;</h1>
    <p class="desc" id="aciklama"></p>
  </div>
</header>

<div class="wrap">
  <div id="form-alani" class="hidden">
    <div class="card intro" id="kimlik-karti">
      <label class="label" for="kimlik"><span id="kimlik-label"></span> <span class="req">*</span></label>
      <p class="hint" id="kimlik-hint"></p>
      <input type="text" id="kimlik" autocomplete="off" spellcheck="false">
      <div class="err" id="kimlik-err"></div>
      <div class="gizlilik" id="gizlilik-notu">
        <span class="ico">&#128274;</span>
        <span id="gizlilik-metin"></span>
      </div>
    </div>

    <p class="ipucu" id="ipucu"></p>
    <p class="ipucu hidden" id="taslak-notu"></p>

    <div id="projeler"></div>

    <div class="actions">
      <div class="progress" id="ilerleme"></div>
      <button class="submit" id="gonder"></button>
    </div>
  </div>

  <div id="tesekkur" class="card durum hidden">
    <div class="ico">&#10003;</div>
    <h2></h2>
    <p></p>
  </div>

  <div id="yukleniyor" class="card durum">
    <div class="spin"></div>
    <p id="yukleniyor-metin">Anket yükleniyor…</p>
  </div>

  <div id="baglanti" class="card durum hata hidden">
    <div class="ico">!</div>
    <h2 id="baglanti-baslik"></h2>
    <p id="baglanti-mesaj"></p>
    <button type="button" id="tekrar"></button>
  </div>

  <div id="kapali" class="card durum kapali hidden">
    <div class="ico">&#8987;</div>
    <h2 id="kapali-baslik"></h2>
    <p id="kapali-mesaj"></p>
  </div>

  <footer id="altbilgi"></footer>
</div>

<script>
/* ======================================================================
   VERİ SERVİSİ ADRESİ — Apps Script web uygulamasının …/exec adresi.
   Apps Script → Dağıt → Dağıtımları yönet → Web uygulaması URL'si.
   "Yeni sürüm" ile güncellediğiniz sürece bu adres değişmez.
   Apps Script içindeki yedek kopyada bu alan BOŞ bırakılır (sayfa google.script.run kullanır).
   ====================================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbxJeAusEhuuWAM8hKxAgHBKRqwm-7AT6tRmRj3eCAsyZZk4Wd9oYb1qVUviosi7yzJfnQ/exec';

/* Varsayılan metinler — Sheets'teki "Metinler" sayfasından değiştirilebilir (boş bırakılan satırda bunlar kullanılır). */
var VARSAYILAN = {
  ustBaslik:        'Fizibilite Komitesi Değerlendirmesi',
  ipucu:            'Seçtiğiniz puana **yeniden tıklarsanız** cevabınız geri alınır.',
  kodEtiket:        'Katılım Kodu',
  kodIpucu:         'Size iletilen katılım kodunu giriniz.',
  kodYerTutucu:     'ÖRN. UYE-07',
  gizlilikNotu:     'Kodunuz yalnızca mükerrer oylamayı engellemek ve katılım takibi için kullanılır. Verdiğiniz puanlar kodunuzla **eşleştirilmez**; oylar ayrı bir sayfada karıştırılarak saklanır.',
  isimEtiket:       'Ad Soyad',
  isimIpucu:        'Değerlendirmenizin kayda geçmesi için ad ve soyadınızı yazınız.',
  isimYerTutucu:    'Örn. Ayşe Yılmaz',
  zorunluHata:      'Bu alan zorunludur.',
  olcekDusuk:       '1 · Çok düşük',
  olcekYuksek:      '10 · Çok yüksek',
  puanHata:         'Lütfen 1-10 arasında bir puan seçiniz.',
  ilerleme:         '{n} / {toplam} proje puanlandı',
  gonderDugme:      'Değerlendirmeyi Gönder',
  gonderiliyor:     'Gönderiliyor…',
  tesekkurBaslik:   'Teşekkür ederiz',
  tesekkurMetin:    'Değerlendirmeniz anonim olarak kaydedildi. Bu sayfayı kapatabilirsiniz.',
  alinmistiBaslik:  'Değerlendirmeniz alınmıştı',
  alinmistiMetin:   'Bu cihazdan bu dönem için değerlendirme zaten gönderildi. Teşekkür ederiz.',
  kapaliBaslik:     'Değerlendirme kapalı',
  kapaliMetin:      'Bu dönem için değerlendirme şu anda açık değil.',
  arsivMetin:       'Bu değerlendirme dönemi tamamlanmış ve arşivlenmiştir. Yeni dönem için size iletilen güncel linki kullanınız.',
  taslakNotu:       'Yarım kalan değerlendirmeniz **kaldığı yerden** geri yüklendi.',
  yukleniyor:       'Anket yükleniyor…',
  baglantiBaslik:   'Bağlantı kurulamadı',
  baglantiMetin:    'Anket bilgileri alınamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.',
  tekrarDene:       'Tekrar dene',
  genelHata:        'Kayıt sırasında bir hata oluştu, lütfen tekrar deneyin.',
  donemKoduEtiket:  'Dönem kodu'
};

var APP = {};
var M = {};
var PROJELER = [];
var KIMLIK = 'KOD';
var gonderiliyor = false;

/* ---------- metin yardımcıları ---------- */
function m(k){ var v = M[k]; return (v !== undefined && v !== null && String(v).trim() !== '') ? String(v) : (VARSAYILAN[k] || ''); }
function kacar(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* Düz metin → güvenli HTML; **kalın** desteklenir, satır sonu <br> olur. */
function zengin(s){
  return kacar(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}
function sablon(s, degerler){
  return String(s).replace(/\{(\w+)\}/g, function(_, k){ return degerler[k] !== undefined ? degerler[k] : ''; });
}
function el(tag, cls, html){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  return n;
}
function $(id){ return document.getElementById(id); }

/* ---------- veri servisi ---------- */
function paramDonem(){
  try { return (new URLSearchParams(location.search).get('d') || '').trim(); } catch(e){ return ''; }
}
/* Çerezsiz (credentials: omit) istek: Google hesap yönlendirmesi devreye girmez. */
function apiGet(){
  var u = API_URL + '?api=1&_=' + Date.now();
  var d = paramDonem();
  if(d) u += '&d=' + encodeURIComponent(d);
  return fetch(u, { method:'GET', credentials:'omit', redirect:'follow', cache:'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function apiPost(veri){
  return fetch(API_URL, { method:'POST', credentials:'omit', redirect:'follow', body: JSON.stringify(veri) })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function appsScriptVar(){ return !!(window.google && google.script && google.script.run); }

/* ---------- cihaz kilidi (yalnızca tam anonim mod) ---------- */
function cihazKimligi(){
  try{
    var k = localStorage.getItem('fk_cihaz');
    if(!k){
      k = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
      localStorage.setItem('fk_cihaz', k);
    }
    return k;
  }catch(e){ return ''; }
}
function oyVerildiMi(){ try{ return localStorage.getItem('fk_oy_' + (APP.donemKod||'')) === '1'; }catch(e){ return false; } }
function oyVerildiIsaretle(){ try{ localStorage.setItem('fk_oy_' + (APP.donemKod||''), '1'); }catch(e){} }

/* ---------- taslak ---------- */
function taslakAnahtar(){ return 'fk_taslak_' + (APP.donemKod||''); }
function taslakKaydet(){
  try{
    var t = { kimlik: ($('kimlik').value || ''), puanlar: {} };
    for(var i=0;i<PROJELER.length;i++){
      var sec = document.querySelector('input[name="p'+i+'"]:checked');
      if(sec) t.puanlar[i] = Number(sec.value);
    }
    localStorage.setItem(taslakAnahtar(), JSON.stringify(t));
  }catch(e){}
}
function taslakYukle(){
  try{
    var raw = localStorage.getItem(taslakAnahtar()); if(!raw) return false;
    var t = JSON.parse(raw) || {}; var geri = 0;
    if(t.kimlik && KIMLIK !== 'ANONIM') $('kimlik').value = t.kimlik;
    Object.keys(t.puanlar || {}).forEach(function(i){
      var r = $('p' + i + '_' + t.puanlar[i]);
      if(r){ r.checked = true; geri++; }
    });
    return geri > 0;
  }catch(e){ return false; }
}
function taslakSil(){ try{ localStorage.removeItem(taslakAnahtar()); }catch(e){} }

/* ---------- ekranlar ---------- */
function durumGoster(id){
  ['form-alani','tesekkur','yukleniyor','baglanti','kapali'].forEach(function(x){ $(x).classList.add('hidden'); });
  if(id) $(id).classList.remove('hidden');
}
function tesekkurGoster(baslik, metin){
  var t = $('tesekkur');
  t.querySelector('h2').textContent = baslik;
  t.querySelector('p').innerHTML = zengin(metin);
  durumGoster('tesekkur');
  window.scrollTo({top:0, behavior:'smooth'});
}
function zatenCevaplandi(){ tesekkurGoster(m('alinmistiBaslik'), m('alinmistiMetin')); }

function yukle(){
  $('yukleniyor-metin').textContent = m('yukleniyor');
  durumGoster('yukleniyor');
  if(!API_URL){ APP = window.APP_VERI || {}; baslat(); return; }   // Apps Script içi yedek sayfa / yerel önizleme
  apiGet().then(function(v){ APP = v || {}; baslat(); })
          .catch(function(e){
            $('baglanti-baslik').textContent = m('baglantiBaslik');
            $('baglanti-mesaj').textContent = m('baglantiMetin') + ' (' + ((e && e.message) || 'hata') + ')';
            $('tekrar').textContent = m('tekrarDene');
            durumGoster('baglanti');
          });
}
function baslat(){
  M = APP.metin || {};
  PROJELER = APP.projeler || [];
  KIMLIK = (APP.kimlik || 'KOD').toUpperCase();
  ciz();
}

function ciz(){
  document.title = APP.baslik || document.title;
  $('baslik').textContent = APP.baslik || '';
  $('eyebrow').textContent = APP.ustBaslik || m('ustBaslik');
  $('aciklama').textContent = APP.aciklama || '';
  $('altbilgi').textContent = APP.altBilgi || '';

  if(!APP.acik || !PROJELER.length){
    $('kapali-baslik').textContent = m('kapaliBaslik');
    $('kapali-mesaj').innerHTML = zengin(APP.kapaliMesaj || m('kapaliMetin'));
    var eskiKod = $('kapali').querySelector('.donem-kod'); if(eskiKod) eskiKod.remove();
    if(APP.donemKod) $('kapali').appendChild(el('p','donem-kod', kacar(m('donemKoduEtiket') + ': ' + APP.donemKod)));
    durumGoster('kapali');
    return;
  }
  if(KIMLIK === 'ANONIM' && oyVerildiMi()){ zatenCevaplandi(); return; }
  durumGoster('form-alani');

  // Sabit metinler
  $('ipucu').innerHTML = zengin(m('ipucu'));
  $('gonder').textContent = m('gonderDugme');

  // Kimlik alanı
  var kart = $('kimlik-karti');
  var inp = $('kimlik');
  $('kimlik-err').textContent = m('zorunluHata');
  if(KIMLIK === 'ANONIM'){
    kart.classList.add('hidden');
  } else if(KIMLIK === 'ISIM'){
    $('kimlik-label').textContent = m('isimEtiket');
    $('kimlik-hint').textContent = m('isimIpucu');
    $('gizlilik-notu').classList.add('hidden');
    inp.placeholder = m('isimYerTutucu');
    inp.style.textTransform = 'none';
    inp.style.letterSpacing = 'normal';
    inp.style.fontWeight = '400';
    inp.setAttribute('autocomplete','name');
  } else {
    $('kimlik-label').textContent = m('kodEtiket');
    $('kimlik-hint').textContent = m('kodIpucu');
    $('gizlilik-metin').innerHTML = zengin(m('gizlilikNotu'));
    inp.placeholder = m('kodYerTutucu');
  }

  var kap = $('projeler');
  kap.innerHTML = '';
  PROJELER.forEach(function(proje, i){
    var k = el('div','card');
    k.id = 'kart-' + i;

    var head = el('div','q-head');
    head.appendChild(el('div','q-num', String(i+1)));
    head.appendChild(el('div','q-text', kacar(proje)));
    k.appendChild(head);

    var scale = el('div','scale');
    for(var p=1; p<=10; p++){
      var r = document.createElement('input');
      r.type='radio'; r.name='p'+i; r.id='p'+i+'_'+p; r.value=p;
      r.addEventListener('change', function(){
        $('kart-' + this.name.substring(1)).classList.remove('invalid');
        ilerlemeGuncelle(); taslakKaydet();
      });
      var lab = document.createElement('label');
      lab.setAttribute('for','p'+i+'_'+p);
      lab.textContent = p;
      lab.addEventListener('click', function(e){          // seçili puana yeniden tıklayınca geri al
        var hedef = $(this.getAttribute('for'));
        if(hedef && hedef.checked){
          e.preventDefault();
          hedef.checked = false;
          ilerlemeGuncelle(); taslakKaydet();
        }
      });
      scale.appendChild(r); scale.appendChild(lab);
    }
    k.appendChild(scale);

    var ends = el('div','scale-ends');
    ends.appendChild(el('span',null,kacar(m('olcekDusuk'))));
    ends.appendChild(el('span',null,kacar(m('olcekYuksek'))));
    k.appendChild(ends);

    k.appendChild(el('div','err',kacar(m('puanHata'))));
    kap.appendChild(k);
  });

  if(!inp.dataset.bagli){
    inp.addEventListener('input', function(){
      if(this.value.trim()) kart.classList.remove('invalid');
      taslakKaydet();
    });
    inp.dataset.bagli = '1';
  }
  var g = $('gonder');
  if(!g.dataset.bagli){ g.addEventListener('click', gonder); g.dataset.bagli = '1'; }

  if(taslakYukle()){
    $('taslak-notu').innerHTML = zengin(m('taslakNotu'));
    $('taslak-notu').classList.remove('hidden');
  }
  ilerlemeGuncelle();
}

function ilerlemeGuncelle(){
  var n = 0;
  for(var i=0;i<PROJELER.length;i++){
    if(document.querySelector('input[name="p'+i+'"]:checked')) n++;
  }
  $('ilerleme').innerHTML = zengin(sablon(m('ilerleme'), { n: '**' + n + '**', toplam: PROJELER.length }));
}

function gonder(){
  if(gonderiliyor) return;
  var ilkHata = null;

  var kart = $('kimlik-karti');
  var inp = $('kimlik');
  var kimlikDeger = '';
  if(KIMLIK !== 'ANONIM'){
    kimlikDeger = inp.value.trim();
    if(!kimlikDeger){ $('kimlik-err').textContent = m('zorunluHata'); kart.classList.add('invalid'); ilkHata = kart; }
  }

  var puanlar = [];
  for(var i=0;i<PROJELER.length;i++){
    var sec = document.querySelector('input[name="p'+i+'"]:checked');
    var k = $('kart-'+i);
    if(!sec){
      k.classList.add('invalid');
      if(!ilkHata) ilkHata = k;
      puanlar.push('');
    } else {
      k.classList.remove('invalid');
      puanlar.push(Number(sec.value));
    }
  }

  if(ilkHata){ ilkHata.scrollIntoView({behavior:'smooth', block:'center'}); return; }

  gonderiliyor = true;
  var btn = $('gonder');
  btn.disabled = true;
  btn.textContent = m('gonderiliyor');

  var veri = { kimlik: kimlikDeger, puanlar: puanlar, donem: APP.donemKod || '',
               cihaz: KIMLIK === 'ANONIM' ? cihazKimligi() : '' };

  if(API_URL){
    apiPost(veri).then(sonuc).catch(hata);
  } else if(appsScriptVar()){
    google.script.run.withSuccessHandler(sonuc).withFailureHandler(hata).cevapKaydet(veri);
  } else {
    setTimeout(function(){ sonuc({ok:true, onizleme:true}); }, 600);   // yerel önizleme
  }
}

function dugmeSifirla(){
  gonderiliyor = false;
  var btn = $('gonder');
  btn.disabled = false;
  btn.textContent = m('gonderDugme');
}

function sonuc(c){
  if(c && c.tekrar){ oyVerildiIsaretle(); taslakSil(); zatenCevaplandi(); return; }
  if(!c || c.ok !== true){
    dugmeSifirla();
    var mesaj = (c && c.mesaj) || m('genelHata');
    if(c && c.alan === 'kimlik'){
      var kart = $('kimlik-karti');
      $('kimlik-err').textContent = mesaj;
      kart.classList.add('invalid');
      kart.scrollIntoView({behavior:'smooth', block:'center'});
    } else {
      alert(mesaj);
    }
    return;
  }
  if(KIMLIK === 'ANONIM' && !c.onizleme) oyVerildiIsaretle();
  if(!c.onizleme) taslakSil();
  tesekkurGoster(m('tesekkurBaslik'), c.onizleme ? 'ÖNİZLEME: Bu bir tasarım önizlemesidir, oy kaydedilmedi.' : m('tesekkurMetin'));
}

function hata(e){
  dugmeSifirla();
  alert(m('genelHata') + '\n\n' + ((e && e.message) || ''));
}

$('tekrar').addEventListener('click', yukle);
yukle();
</script>
</body>
</html>
